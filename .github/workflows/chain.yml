# Watches the two chains a release rides on, so a broken one is reported instead of discovered.
#
# It exists because the two fail INDEPENDENTLY: the website's button answered 404 for nearly eight
# hours while Sparkle kept updating everyone perfectly. Checking one proves nothing about the other,
# and nothing was checking either once the publishing command had exited.
#
# Runs on its own — that is the point. A guard inside `make publish` only fires when someone uses it,
# and the failure it would have caught came from a release published another way.
name: chain

on:
  release:
    types: [published, edited, deleted]
  # The feed lives on Pages, so a push can break the chain without touching a release.
  push:
    branches: [main]
  schedule:
    # Once a day. The damage is proportional to how long a broken link stays up, not to how it broke.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The website's download button must resolve
        # The site links to `releases/latest/download/OpenNegative.dmg`. The name carries NO version:
        # an asset called otherwise is a 404 that only a visitor discovers.
        run: |
          url=https://github.com/${{ github.repository }}/releases/latest/download/OpenNegative.dmg
          code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
          if [ "$code" != 200 ]; then
            echo "::error::the download button answers $code — $url"
            echo "the latest release must carry an asset named exactly OpenNegative.dmg"
            gh release view --repo ${{ github.repository }} --json tagName,assets \
              --jq '"latest is \(.tagName), assets: \(.assets | map(.name) | join(", "))"'
            exit 1
          fi
          echo "download button: $code"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Every enclosure the update feed advertises must be fetchable
        # A dead enclosure stops updates for everyone and reports nothing: Sparkle simply fails to
        # download, quietly, on each machine. Deltas count as much as the zips — they are what it
        # reaches for first.
        run: |
          feed=https://5e1y.github.io/${{ github.event.repository.name }}/appcast.xml
          curl -sf "$feed" -o appcast.xml || { echo "::error::the feed itself is unreachable at $feed"; exit 1; }
          urls=$(grep -oE 'url="[^"]*\.(zip|delta)"' appcast.xml | cut -d'"' -f2)
          n=$(printf '%s\n' "$urls" | grep -c . || true)
          # Reporting success on an empty list is the failure mode of every check of this shape.
          if [ "$n" -eq 0 ]; then
            echo "::error::no enclosure found in the feed — this check would have passed on nothing"
            exit 1
          fi
          bad=0
          for u in $urls; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$u")
            [ "$code" = 200 ] || { echo "::error::dead enclosure ($code) — $u"; bad=1; }
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "$n enclosures, all answering"

      - name: The feed must name the latest release
        # Catches the half-publish: assets uploaded, feed never pushed. Updates then keep working on
        # the old version while the website hands out a newer one, and nobody notices for weeks.
        run: |
          latest=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          version=${latest#v}
          if ! grep -q "releases/download/$latest/" appcast.xml; then
            echo "::error::the feed does not mention $latest — the release was published without it"
            exit 1
          fi
          echo "feed carries $version"
        env:
          GH_TOKEN: ${{ github.token }}
