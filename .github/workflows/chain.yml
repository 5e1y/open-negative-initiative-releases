# Watches the two chains a release rides on, so a broken one is reported instead of discovered.
#
# It exists because the two fail INDEPENDENTLY: the website's button answered 404 for nearly eight
# hours while Sparkle kept updating everyone perfectly. Checking one proves nothing about the other,
# and nothing was checking either once the publishing command had exited.
#
# Runs on its own — that is the point. A guard inside `make publish` only fires when someone uses it,
# and the failure it would have caught came from a release published another way.
name: chain

on:
  release:
    types: [published, edited, deleted]
  # The feed lives on Pages, so a push can break the chain without touching a release.
  push:
    branches: [main]
  schedule:
    # Once a day. The damage is proportional to how long a broken link stays up, not to how it broke.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ **THIS WORKFLOW ASKS THE API, IT DOES NOT FETCH THE FILES — and that is a correction, not a
      # style.** Every check below used to `curl` the assets. Measured on 18 August 2026: a HEAD
      # request increments GitHub's `download_count` just like a GET does, and this file ran 54 times
      # between 6 and 18 August, hitting each of the feed's 123 enclosures TWICE per run. 54 × 2 = 108,
      # against counters sitting at ~76-81. The "downloads" nobody could explain were this workflow.
      #
      # The give-away was in the data all along: `-source.zip` and the stray `OpenNegative516-482.delta`
      # sit at 0 — they are the only assets the feed does not list, so the only ones nothing here
      # touched. Curl was measuring the thing it was watching.
      #
      # The API reports an asset's name and size without serving a byte, which is also the stricter
      # check: no redirect to follow, no CDN in the way, no timeout to misread as a dead link.
      - name: The website's download button must resolve
        # The site links to `releases/latest/download/OpenNegative.dmg`. The name carries NO version:
        # an asset called otherwise is a 404 that only a visitor discovers. That URL resolves if and
        # only if the latest release carries an asset with exactly this name — which the API states
        # directly, rather than being inferred from a 200.
        run: |
          assets=$(gh release view --repo ${{ github.repository }} --json assets --jq '.assets[].name')
          if ! printf '%s\n' "$assets" | grep -qx 'OpenNegative.dmg'; then
            echo "::error::the latest release carries no asset named exactly OpenNegative.dmg"
            echo "the website's download button would answer 404"
            printf '%s\n' "$assets" | sed 's/^/  found: /'
            exit 1
          fi
          echo "download button: the latest release carries OpenNegative.dmg"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: The published feed, waited for rather than caught mid-build
        # Pages rebuilds for about a minute after a push, and publishing creates the release BEFORE
        # pushing the feed — so a run fired by either reads the previous feed and reports a
        # half-publish that is not one. Every release since v0.0.14 failed exactly there. Waited
        # for on the same terms `make publish` waits: twenty tries, fifteen seconds apart.
        run: |
          feed=https://5e1y.github.io/${{ github.event.repository.name }}/appcast.xml
          latest=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          n=0
          while :; do
            curl -sf "$feed?n=$n" -o appcast.xml \
              || { echo "::error::the feed itself is unreachable at $feed"; exit 1; }
            grep -q "releases/download/$latest/" appcast.xml && break
            n=$((n + 1))
            # The wait is bounded, and running out is a REAL half-publish: the assets went and the
            # feed never followed, which leaves every installed app on the version before.
            if [ "$n" -ge 20 ]; then
              echo "::error::the feed still does not name $latest after five minutes"
              exit 1
            fi
            sleep 15
          done
          echo "feed names $latest after ~$((n * 15))s"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: The feed the APP asks for, which is no longer this one
        # Since 18 August the app's SUFeedURL points at the website, which proxies this feed in order
        # to count update checks — `download_count` cannot tell a running copy from a crawler, and it
        # was measured doing exactly that. The proxy is therefore a new link in the update chain, and
        # an unwatched link is the whole reason this workflow exists: if it stops answering, every
        # installed copy silently stops updating and nothing reports it.
        #
        # Waited for on the same terms as the Pages step above, because the Worker caches the upstream
        # for two minutes: right after a publish it can still be serving the previous feed while Pages
        # already carries the new one. Failing there would be crying wolf over a perfect release.
        run: |
          proxied=https://open-negative-initiative.com/appcast.xml
          latest=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          n=0
          while :; do
            code=$(curl -s -o proxied.xml -w '%{http_code}' "$proxied?n=$n")
            [ "$code" = 200 ] || { echo "::error::the app's feed answers $code — $proxied"; exit 1; }
            grep -q "releases/download/$latest/" proxied.xml && break
            n=$((n + 1))
            if [ "$n" -ge 12 ]; then
              echo "::error::the app's feed still does not name $latest after three minutes"
              echo "installed copies ask THIS url, not Pages — they are stuck on the previous version"
              exit 1
            fi
            sleep 15
          done
          # Byte for byte: a proxy that rewrote anything would break the signatures the feed carries.
          cmp -s proxied.xml appcast.xml || {
            echo "::error::the proxied feed differs from the one Pages publishes"
            exit 1
          }
          echo "the app's feed names $latest and matches Pages byte for byte"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Every enclosure the update feed advertises must be fetchable
        # A dead enclosure stops updates for everyone and reports nothing: Sparkle simply fails to
        # download, quietly, on each machine. Deltas count as much as the zips — they are what it
        # reaches for first.
        run: |
          # The inventory of what actually exists, asked once, without serving a byte. Each line is
          # `<tag>/<asset name> <size>` — the two halves of a release-download URL plus the length the
          # feed will be checked against.
          gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100' \
            --jq '.[] | .tag_name as $t | .assets[] | "\($t)/\(.name) \(.size)"' | sort > inventory.txt
          [ -s inventory.txt ] || { echo "::error::the API returned no asset at all"; exit 1; }

          # Each enclosure parsed whole, so a reordering of attributes cannot silently stop matching.
          python3 - <<'CHECK'
          import re, sys
          feed = open("appcast.xml", encoding="utf-8").read()
          have = {}
          for line in open("inventory.txt", encoding="utf-8"):
              path, size = line.rsplit(" ", 1)
              have[path] = int(size)

          enclosures = []
          for tag in re.findall(r"<enclosure[^>]*>", feed):
              url = re.search(r'url="([^"]+)"', tag)
              length = re.search(r'length="(\d+)"', tag)
              if url and length:
                  enclosures.append((url.group(1), int(length.group(1))))

          # Reporting success on an empty list is the failure mode of every check of this shape.
          if not enclosures:
              print("::error::no enclosure found in the feed — this check would have passed on nothing")
              sys.exit(1)

          bad = 0
          for url, length in enclosures:
              path = "/".join(url.split("/releases/download/")[-1].split("/")[:2])
              if path not in have:
                  print(f"::error::the feed advertises {path}, which no release carries")
                  bad += 1
              elif have[path] != length:
                  print(f"::error::{path} is {have[path]} bytes, the feed announces {length}")
                  bad += 1
          print(f"{len(enclosures)} enclosures, {len(enclosures) - bad} present at their announced length")
          sys.exit(1 if bad else 0)
          CHECK
        env:
          GH_TOKEN: ${{ github.token }}

      - name: The newest build's signature must verify — a bad one refuses to install, in silence
        # THE failure that says nothing: Sparkle checks the EdDSA signature against the bytes it just
        # downloaded, and refuses on mismatch without the user learning why. A single asset replaced
        # or re-uploaded is enough, and the feed still looks perfect.
        #
        # ⚠️ **This is the ONE step that downloads anything, and it is deliberately the only one.**
        # Verifying a signature means having the bytes; there is no API for it. Every enclosure's
        # LENGTH is already checked above without a single request, which catches any change of
        # content — so what is left to prove by download is the one archive everybody is about to
        # install. One file per run instead of 123, and only when a release moved or on the daily
        # sweep: a push that touches the README has no business fetching a binary.
        if: github.event_name != 'push'
        run: |
          python3 -m pip install --quiet pynacl
          python3 - <<'CHECK'
          import base64, re, subprocess, sys
          import nacl.signing, nacl.exceptions

          KEY = "Sn54zBsnQ9IN6MZEyfAzYn4fQi03aUihVjaA5Ejn7qM="
          feed = open("appcast.xml", encoding="utf-8").read()

          newest = None
          for tag in re.findall(r"<enclosure[^>]*>", feed):
              url = re.search(r'url="([^"]+)"', tag)
              sig = re.search(r'sparkle:edSignature="([^"]+)"', tag)
              if url and sig:
                  newest = (url.group(1), sig.group(1))
                  break

          if newest is None:
              print("::error::no signed enclosure in the feed — this check would pass on nothing")
              sys.exit(1)

          url, signature = newest
          print(f"verifying the signature of {url.split('/')[-1]}")
          blob = subprocess.run(["curl", "-sL", url], capture_output=True).stdout
          key = nacl.signing.VerifyKey(base64.b64decode(KEY))
          try:
              key.verify(blob, base64.b64decode(signature))
              print("signature verifies against the shipped public key")
          except nacl.exceptions.BadSignatureError:
              print(f"::error::{url} does not match its signature — updates will refuse to install")
              sys.exit(1)
          CHECK

      - name: The feed must name the latest release
        # The half-publish this whole job exists for: assets uploaded, feed never pushed. Updates
        # then keep working on the old version while the website hands out a newer one. The step
        # above is what waits; this one only states the conclusion, so a green line means the feed
        # really carries the release and not that nobody looked yet.
        run: |
          latest=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          if ! grep -q "releases/download/$latest/" appcast.xml; then
            echo "::error::the feed does not mention $latest — the release was published without it"
            exit 1
          fi
          echo "feed carries ${latest#v}"
        env:
          GH_TOKEN: ${{ github.token }}
